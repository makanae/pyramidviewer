<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>月山道路 Information Pyramid Web3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif}#c{width:100%;height:100%;display:block}
#ui{position:absolute;top:12px;left:12px;background:#ffffffdd;padding:10px 12px;border-radius:8px;max-width:360px;font-size:13px}
#tip{position:absolute;display:none;background:#111d;color:white;padding:8px;border-radius:6px;pointer-events:none;max-width:320px;font-size:12px}
label{display:block;margin:5px 0}</style></head><body><canvas id="c"></canvas>
<div id="ui"><b>月山道路 Information Pyramid — 実時間3D</b>
<div>ドラッグ：回転　ホイール：拡大縮小　右ドラッグ：移動　ノード：クリック</div>
<label><input id="labels" type="checkbox" checked> ラベル表示</label>
<label><input id="grid" type="checkbox" checked> 年軸・レベル面表示</label>
<div>◇ Acquisition　□ Rebuild　△ Future</div></div><div id="tip"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const D=await fetch('./data.json').then(r=>r.json()), c=document.getElementById('c');
const r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(devicePixelRatio);
const s=new THREE.Scene();s.background=new THREE.Color(0xf7f8fa);const cam=new THREE.PerspectiveCamera(48,1,.1,1000);cam.position.set(28,-34,22);
const ctl=new OrbitControls(cam,c);ctl.enableDamping=true;ctl.target.set(12,0,3);
s.add(new THREE.AmbientLight(0xffffff,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(10,-10,20);s.add(dl);
const x=yr=>(yr-D.year_min)/(D.year_max-D.year_min)*24;
const mats={info:new THREE.MeshStandardMaterial({color:0x3d6ea8}),survey:new THREE.MeshStandardMaterial({color:0x3a9d7d}),
rebuild:new THREE.MeshStandardMaterial({color:0xd67a2f}),future:new THREE.MeshStandardMaterial({color:0x8055a5})};
const objs=new Map(), clickable=[];
for(const n of D.nodes){let g=n.kind==='survey'?new THREE.OctahedronGeometry(.11):n.kind==='rebuild'?new THREE.BoxGeometry(.18,.18,.18):n.kind==='future'?new THREE.ConeGeometry(.13,.25,8):new THREE.SphereGeometry(.095,10,8);
 let m=new THREE.Mesh(g,mats[n.kind]||mats.info);m.position.set(x(n.year),n.y,n.z);m.userData=n;s.add(m);objs.set(n.id,m);clickable.push(m);}
function line(a,b,kind){const g=new THREE.BufferGeometry().setFromPoints([a.position,b.position]);const mat=new THREE.LineBasicMaterial({color:kind==='future'?0x8055a5:0x777777,transparent:true,opacity:.55});s.add(new THREE.Line(g,mat));}
for(const l of D.links){if(objs.has(l.a)&&objs.has(l.b))line(objs.get(l.a),objs.get(l.b),l.kind);}
const gridGroup=new THREE.Group();s.add(gridGroup);
for(const yr of [1894,1904,1932,1935,1959,1971,1981,2000,2010,2024,2026]){const xx=x(yr);const pts=[new THREE.Vector3(xx,-14,0),new THREE.Vector3(xx,14,0)];gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xcccccc})));
 const sp=document.createElement('canvas');sp.width=256;sp.height=64;const q=sp.getContext('2d');q.font='28px sans-serif';q.fillText(String(yr),4,35);const tex=new THREE.CanvasTexture(sp);const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));spr.position.set(xx,-14.5,.15);spr.scale.set(2,.5,1);gridGroup.add(spr);}
const labelGroup=new THREE.Group();s.add(labelGroup);
for(const n of D.nodes){if(n.z<2.5&&n.kind==='info')continue;const cv=document.createElement('canvas');cv.width=600;cv.height=70;const q=cv.getContext('2d');q.font='24px sans-serif';q.fillStyle='#111';q.fillText(n.label,5,35);const t=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));sp.position.set(x(n.year),n.y,n.z+.28);sp.scale.set(4.2,.49,1);labelGroup.add(sp);}
document.getElementById('labels').onchange=e=>labelGroup.visible=e.target.checked;document.getElementById('grid').onchange=e=>gridGroup.visible=e.target.checked;
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.getElementById('tip');
c.addEventListener('click',e=>{const b=c.getBoundingClientRect();mouse.x=(e.clientX-b.left)/b.width*2-1;mouse.y=-(e.clientY-b.top)/b.height*2+1;ray.setFromCamera(mouse,cam);const h=ray.intersectObjects(clickable)[0];if(!h){tip.style.display='none';return}const n=h.object.userData;tip.innerHTML='<b>'+n.label+'</b><br>年: '+n.year+'<br>種別: '+n.kind+'<br>確認: '+(n.status||'');tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.style.display='block';});
function resize(){const w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
(function loop(){requestAnimationFrame(loop);ctl.update();r.render(s,cam)})();</script></body></html>
