<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Information Pyramid 3D Viewer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans JP",sans-serif;background:#eef2f6}
#app{position:relative;width:100%;height:100%}
canvas{display:block}
#panel{position:absolute;left:10px;top:10px;width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;background:rgba(255,255,255,.93);padding:12px;border-radius:12px;box-shadow:0 4px 20px #0003;font-size:13px}
h1{font-size:16px;margin:0 0 8px}.row{margin:7px 0}.row label{display:flex;justify-content:space-between;gap:8px}
button{padding:6px 9px;margin:2px;border:1px solid #aaa;border-radius:7px;background:white}
input[type=range]{width:100%}
#tip{position:absolute;display:none;pointer-events:none;background:#111d;color:white;padding:6px 8px;border-radius:6px;font-size:12px;max-width:300px}
#detail{white-space:pre-wrap;background:#f3f5f7;padding:8px;border-radius:7px;min-height:36px}
.legend{font-size:11px;line-height:1.45;color:#444}
@media(max-width:600px){#panel{width:270px;font-size:12px;padding:9px}h1{font-size:14px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body><div id="app"><div id="panel">
<h1>仙台湾南部海岸 Information Pyramid</h1>
<div class="row">
<button id="home">全体表示</button><button id="labels">ラベル ON/OFF</button><button id="links">リンク ON/OFF</button>
</div>
<div class="row"><label>レイヤー透明度 <span id="oval">0.16</span></label><input id="opacity" type="range" min="0" max=".6" step=".02" value=".16"></div>
<div class="row" id="layers"></div>
<div class="legend">X＝時間（2011=0、1年=8単位）／ Y＝分岐 ／ Z＝抽象度。<br>ノードをタップすると名称・階層・工区・工種・工期を表示します。ラベルは距離に応じて自動表示します。</div>
<div class="row"><b>選択ノード</b><div id="detail">ノードをタップしてください。</div></div>
</div><div id="tip"></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const app=document.getElementById('app'), detail=document.getElementById('detail');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef2f6);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000);
camera.position.set(70,-65,45);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.target.set(25,0,10);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.3));
const dl=new THREE.DirectionalLight(0xffffff,2); dl.position.set(20,-20,60); scene.add(dl);

const meta=await fetch('pyramid_metadata.json').then(r=>r.json());
const levels={L1:24,L2:20,L3:16,"L4.1":12,"L4.2":8,"L4.3":4.3,L5:.8};
const layerColors={L1:0x4472c4,L2:0x5b9bd5,L3:0x9dc3e6,"L4.1":0xb4c6e7,"L4.2":0xd9e2f3,"L4.3":0xc6e0b4,L5:0x70ad47};
const layerMeshes={};
let layerOpacity=.16;
for(const [lv,z] of Object.entries(levels)){
 const geo=new THREE.PlaneGeometry(82,44), mat=new THREE.MeshBasicMaterial({color:layerColors[lv],transparent:true,opacity:layerOpacity,side:THREE.DoubleSide,depthWrite:false});
 const m=new THREE.Mesh(geo,mat); m.rotation.x=Math.PI/2; m.position.set(28,0,z); scene.add(m); layerMeshes[lv]=m;
}
const grid=new THREE.GridHelper(82,20,0x718096,0xcbd5e1); grid.position.set(28,0,0); scene.add(grid);

// axes
function line(a,b,color=0x334155){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]); scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color})))}
line([-5,-20,0],[76,-20,0]); line([-5,-20,0],[-5,20,0]); line([-5,-20,0],[-5,-20,27]);
const labelsGroup=new THREE.Group(); scene.add(labelsGroup);
function label(text,pos,size=0.9,color='#172033'){
 const cv=document.createElement('canvas'),ctx=cv.getContext('2d'); const scale=3; ctx.font=`${18*scale}px sans-serif`; const w=Math.ceil(ctx.measureText(text).width+16*scale),h=28*scale; cv.width=w;cv.height=h;ctx.font=`${18*scale}px sans-serif`;ctx.fillStyle='rgba(255,255,255,.82)';ctx.fillRect(0,0,w,h);ctx.fillStyle=color;ctx.fillText(text,8*scale,20*scale);
 const tex=new THREE.CanvasTexture(cv); const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false})); spr.position.set(...pos); spr.scale.set(size*w/h,size,1); spr.userData.baseScale=spr.scale.clone(); labelsGroup.add(spr); return spr;
}
for(let y=2011;y<=2020;y++){const x=(y-2011)*8; line([x,-20,0],[x,-19.4,0]); label(String(y),[x,-21,0],1.1)}
for(const [lv,z] of Object.entries(levels)) label(lv,[-6.5,-20,z],1.05);

const nodeGroup=new THREE.Group(), linkGroup=new THREE.Group(); scene.add(nodeGroup,linkGroup);
const pickables=[], nodeSprites=[];
const levelRadius={L1:.62,L2:.58,L3:.55,"L4.1":.42,"L4.2":.25,"L4.3":.15,L5:.12};

for(const n of meta.nodes){
 let lv=n.level || (n.name.startsWith('工区_')?'L4.1':null);
 if(!lv && n.name.startsWith('本復-'))lv='L4.2';
 if(!lv && n.name.startsWith('L5_'))lv='L5';
 if(!lv) continue;
 const geo=new THREE.SphereGeometry(levelRadius[lv]||.18,10,7),mat=new THREE.MeshStandardMaterial({color:layerColors[lv]||0x888888});
 const m=new THREE.Mesh(geo,mat); m.position.fromArray(n.position); m.userData={...n,level:lv}; nodeGroup.add(m);pickables.push(m);
 // labels: always upper, districts; zoom-dependent contracts/worktypes
 let text=n.label||n.name;
 if(lv==='L4.2') text=n.name;
 if(lv==='L4.3') text=n.work_type||n.name;
 if(['L1','L2','L3','L4.1','L4.2','L4.3'].includes(lv)){
   const sp=label(text,[n.position[0],n.position[1],n.position[2]+(.45)],lv==='L4.3'?.45:lv==='L4.2'?.55:.85);
   sp.userData.level=lv; nodeSprites.push(sp);
 }
}
for(const l of meta.links){
 const a=l.from,b=l.to; const pts=[new THREE.Vector3(...a),new THREE.Vector3(...b)];
 const mat=new THREE.LineBasicMaterial({color:l.kind==='duration'?0xa0a0a0:0x44546a,transparent:true,opacity:l.kind==='duration'?.28:.72});
 const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat); ln.userData.kind=l.kind;linkGroup.add(ln);
}

const layerUI=document.getElementById('layers');
for(const lv of Object.keys(levels)){
 const id='cb'+lv.replace('.','_'); layerUI.insertAdjacentHTML('beforeend',`<label><span><input type="checkbox" id="${id}" checked> ${lv}</span></label>`);
 document.getElementById(id).onchange=e=>{layerMeshes[lv].visible=e.target.checked; for(const m of pickables)if(m.userData.level===lv)m.visible=e.target.checked; for(const s of nodeSprites)if(s.userData.level===lv)s.visible=e.target.checked;};
}
document.getElementById('opacity').oninput=e=>{layerOpacity=+e.target.value;document.getElementById('oval').textContent=layerOpacity.toFixed(2);for(const m of Object.values(layerMeshes))m.material.opacity=layerOpacity};
let labelOn=true,linkOn=true;
document.getElementById('labels').onclick=()=>{labelOn=!labelOn;labelsGroup.visible=labelOn};
document.getElementById('links').onclick=()=>{linkOn=!linkOn;linkGroup.visible=linkOn};
document.getElementById('home').onclick=()=>{camera.position.set(70,-65,45);controls.target.set(25,0,10);controls.update()};

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',ev=>{
 const r=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-r.left)/r.width)*2-1;mouse.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);
 const hit=ray.intersectObjects(pickables.filter(x=>x.visible),false)[0]; if(!hit)return;
 const d=hit.object.userData; const lines=[d.label||d.name,`階層: ${d.level}`]; if(d.district)lines.push(`工区/地区: ${d.district}`);if(d.contract)lines.push(`本復: ${d.contract}`);if(d.work_type)lines.push(`工種: ${d.work_type}`);if(d.start)lines.push(`着工: ${d.start}`);if(d.finish)lines.push(`竣工: ${d.finish}`);if(d.date)lines.push(`日付: ${d.date}`); detail.textContent=lines.join('\n');
});

function animate(){
 requestAnimationFrame(animate);controls.update();
 const dist=camera.position.distanceTo(controls.target);
 for(const s of nodeSprites){
   const lv=s.userData.level;
   let vis=true;
   if(lv==='L4.3')vis=dist<52;
   else if(lv==='L4.2')vis=dist<78;
   s.visible=labelOn&&vis;
 }
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
