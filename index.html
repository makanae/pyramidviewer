<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Information Pyramid Multi-case Viewer</title><style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#eef2f6}canvas{display:block}
#p{position:absolute;z-index:2;left:10px;top:10px;width:min(360px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;background:#fffffff0;padding:11px;border-radius:12px;box-shadow:0 4px 18px #0003;font-size:12px}
h1{font-size:15px;margin:0 0 7px}button,select{padding:6px;margin:2px;border:1px solid #aaa;border-radius:7px;background:white}input[type=range]{width:100%}.r{margin:7px 0}#d{white-space:pre-wrap;background:#f3f5f7;padding:7px;border-radius:7px;min-height:35px}.s{font-size:10.5px;color:#555}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body><div id="p"><h1>Information Pyramid 3D</h1><div class="r"><select id="ds"><option value="sendai">仙台湾南部海岸</option><option value="abukuma">阿武隈川・名取川</option></select><button id="home">全体表示</button></div>
<div class="r"><button id="lab">ラベル</button><button id="lin">リンク</button><button id="un">未確定ノード</button></div>
<div class="r">レイヤー透明度 <span id="ov">0.20</span><input id="op" type="range" min="0" max=".55" step=".01" value=".20"></div><div id="layers"></div>
<div class="s">阿武隈川・名取川の赤ノード＝契約は確認済みだが工種リンク未確定。タップで詳細表示。</div><div class="r"><b>選択ノード</b><div id="d">ノードをタップしてください。</div></div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const DATA=await fetch('datasets.json').then(r=>r.json()),scene=new THREE.Scene();scene.background=new THREE.Color(0xeef2f6);
const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1200);const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.2));let dl=new THREE.DirectionalLight(0xffffff,1.8);dl.position.set(20,-20,60);scene.add(dl);
let root,pick,sprites,layers,labelsOn=true,linksOn=true,unOn=true,opacity=.20;
const Z={L1:24,L2:20,L3:16,"L4.1":12,"L4.2":8,"L4.3":4.2,L5:.8},C={L1:0x274c77,L2:0x4472c4,L3:0x5b9bd5,"L4.1":0x9dc3e6,"L4.2":0xd9e2f3,"L4.3":0xc6e0b4,L5:0x70ad47,Event:0xc0504d};
function lbl(t,p,sc=.7){let cv=document.createElement('canvas'),x=cv.getContext('2d');x.font='40px sans-serif';cv.width=Math.max(120,x.measureText(t).width+25);cv.height=55;x.font='40px sans-serif';x.fillStyle='#ffffffdd';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#172033';x.fillText(t,10,41);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false}));s.position.set(...p);s.scale.set(sc*cv.width/cv.height,sc,1);root.add(s);sprites.push(s);return s}
function build(k){if(root)scene.remove(root);root=new THREE.Group();scene.add(root);pick=[];sprites=[];layers={};document.getElementById('layers').innerHTML='';let d=DATA[k],xs=d.nodes.map(n=>n.position[0]),ys=d.nodes.map(n=>Math.abs(n.position[1])),mn=Math.min(...xs),mx=Math.max(...xs),my=Math.max(20,...ys);
 for(let [lv,z] of Object.entries(Z)){let q=new THREE.Mesh(new THREE.PlaneGeometry(mx-mn+18,my*2+8),new THREE.MeshBasicMaterial({color:C[lv],transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false}));q.position.set((mx+mn)/2,0,z);q.renderOrder=-10;root.add(q);layers[lv]=q;let id='c'+lv.replace('.','');document.getElementById('layers').insertAdjacentHTML('beforeend',`<label><input id="${id}" type="checkbox" checked>${lv}</label> `);document.getElementById(id).onchange=e=>q.visible=e.target.checked}
 for(let n of d.nodes){let lv=n.level;if(!C[lv])continue;let unresolved=k==='abukuma'&&lv==='L4.2'&&(!n.association_status||n.association_status.includes('REVIEW'));let r=lv==='L1'?.62:lv==='L2'?.58:lv==='L3'?.52:lv==='L4.1'?.4:lv==='L4.2'?.24:lv==='L4.3'?.14:.13;let m=new THREE.Mesh(new THREE.SphereGeometry(r,10,7),new THREE.MeshStandardMaterial({color:unresolved?0xc0504d:C[lv]}));m.position.fromArray(n.position);m.userData={...n,unresolved};root.add(m);pick.push(m);if(['L1','L2','L3','L4.1','L4.2'].includes(lv)){let s=lbl(n.label||n.record_id||n.name,[...n.position.slice(0,2),n.position[2]+.45],lv==='L4.2'?.5:.8);s.userData.level=lv}}
 for(let l of d.links){let ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...l.from),new THREE.Vector3(...l.to)]),new THREE.LineBasicMaterial({color:l.kind==='feedback'?0xc0504d:0x44546a,transparent:true,opacity:.72}));ln.userData.link=true;root.add(ln)}
 ctl.target.set((mx+mn)/2,0,10);cam.position.set(mx*.75+35,-Math.max(65,my*2),48);ctl.update()}
build('sendai');ds.onchange=e=>build(e.target.value);op.oninput=e=>{opacity=+e.target.value;ov.textContent=opacity.toFixed(2);Object.values(layers).forEach(x=>x.material.opacity=opacity)};lab.onclick=()=>{labelsOn=!labelsOn;sprites.forEach(x=>x.visible=labelsOn)};lin.onclick=()=>{linksOn=!linksOn;root.children.filter(x=>x.userData.link).forEach(x=>x.visible=linksOn)};un.onclick=()=>{unOn=!unOn;pick.filter(x=>x.userData.unresolved).forEach(x=>x.visible=unOn)};home.onclick=()=>build(ds.value);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();ren.domElement.addEventListener('pointerdown',e=>{let r=ren.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,cam);let h=ray.intersectObjects(pick.filter(x=>x.visible))[0];if(!h)return;let a=h.object.userData,o=[a.label||a.contract_name||a.work_type||a.name,`階層: ${a.level}`];for(let [k,l]of[['river','河川'],['area','地区'],['record_id','契約ID'],['contract_name','工事名'],['work_type','工種'],['start','着工'],['finish','竣工'],['association_status','監査状態']])if(a[k])o.push(`${l}: ${a[k]}`);d.textContent=o.join('\n')});
function go(){requestAnimationFrame(go);ctl.update();let dist=cam.position.distanceTo(ctl.target);sprites.forEach(s=>s.visible=labelsOn&&(s.userData.level!=='L4.2'||dist<85));ren.render(scene,cam)}go();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script></body></html>
